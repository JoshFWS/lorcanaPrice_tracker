<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Lorcana Price Tracker</h1>

    <div class="status" id="status">
      <span id="statusText">Loading...</span>
    </div>

    <section>
      <h2>Discord Webhook</h2>
      <input type="text" id="webhookUrl" placeholder="https://discord.com/api/webhooks/..." />
    </section>

    <section>
      <h2>Schedule</h2>
      <div class="row" id="scheduleRow">
        <input type="time" id="time1" value="09:00" />
        <input type="time" id="time2" value="21:00" />
      </div>
    </section>

    <section>
      <h2>Paranoid Mode</h2>
      <div class="paranoid-row">
        <label class="toggle-label">
          <input type="checkbox" id="paranoidMode" />
          <span>Enable paranoid mode</span>
        </label>
      </div>
      <div id="paranoidOptions" class="paranoid-options hidden">
        <label>Checks per hour</label>
        <input type="number" id="checksPerHour" min="1" max="12" value="1" />
        <p class="hint">Randomizes check times to avoid IP blocks. Only sends Discord updates when prices change.</p>
      </div>
    </section>

    <section>
      <h2>Products</h2>
      <div id="productList"></div>
      <button id="addProduct" class="btn-secondary">+ Add Product</button>
    </section>

    <div class="actions">
      <button id="save" class="btn-primary">Save</button>
      <button id="runNow" class="btn-primary">Run Now</button>
    </div>

    <div id="message" class="message hidden"></div>

    <div class="author-credit">
      <a id="authorLink" href="https://github.com/Josh_FWS" target="_blank" class="author-link">Josh Valencia</a>
    </div>
  </div>

  <div id="customCursor" class="custom-cursor"></div>

  <script src="popup.js" type="module"></script>
</body>
</html>
